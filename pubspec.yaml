name: mushaf_app
description: "Version 1.0 MVP Madinah Mushaf (15-line QPC V1) for iOS and Android."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.3.2
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true

  assets:
    - assets/mushaf.db
    - assets/images/
    - assets/fonts/
    - assets/fonts/qpc/

  fonts:
    - family: QPC1BSML
      fonts:
        - asset: assets/fonts/QPC1BSML.ttf
    - family: Surahs
      fonts:
        - asset: assets/fonts/Surahs.ttf
